general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # wake display after resume
}

listener {
    timeout = 300                      # 5min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

# NOTE: worth verifying `hyprctl dispatch dpms off` actually blanks the
# external display on this hardware before trusting it unattended — DPMS
# was a no-op on Apple Silicon laptops' internal panel (DCP firmware ignored
# it), unclear whether that also applies to the Mini's external-output path.
listener {
    timeout = 330                        # 5.5min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

