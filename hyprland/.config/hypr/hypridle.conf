general {
    lock_cmd = pidof hyprlock || hyprlock                    # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                 # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms(1)'       # wake display after resume
}

listener {
    timeout = 300                      # 5min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

# Under Lua config mode, `hyprctl dispatch` takes a Lua expression, not the old
# `dispatch dpms off` string form — see CLAUDE.md's "Lua config gotchas". Confirmed
# live on this hardware: `hl.dsp.dpms(0)` genuinely blanks the external display (not
# a no-op like on Apple Silicon laptops' internal panel). `hl.dsp.dpms(1)` to
# explicitly wake it back up was NOT reliably confirmed via dispatch alone in
# testing — actual recovery came through Hyprland's built-in
# misc:mouse_move_enables_dpms / misc:key_press_enables_dpms wake-on-input (both
# enabled in looknfeel.lua), which fires independently of this on-resume line.
listener {
    timeout = 330                          # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms(0)'
    on-resume = hyprctl dispatch 'hl.dsp.dpms(1)'
}

