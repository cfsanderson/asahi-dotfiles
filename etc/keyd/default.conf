[ids]
*

[main]
# CapsLock: tap = Escape, hold = nav layer for hjkl arrow keys
# Escape: swapped to act as CapsLock
capslock = overload(nav, esc)
esc = capslock

[nav]
# Arrow keys via CapsLock+hjkl
# Real Ctrl+hjkl is unaffected, so tmux/vim navigation still works
h = left
j = down
k = up
l = right
