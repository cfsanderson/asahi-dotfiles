# borrowed heavily from @omerxx - https://github.com/omerxx/dotfiles/tree/master/tmux

source-file ~/.config/tmux/tmux.reset.conf

set -g default-shell /usr/bin/zsh # explicit, though $SHELL is already zsh via chsh on this machine
setw -g pane-base-index 1        # start indexing panes at 1 instead of 0
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# catppuccin/tmux (manual install per upstream's recommendation - TPM has
# name-conflict issues with this plugin), recolored to the cfs-gruvbox-material
# palette used everywhere else (see ~/.local/share/nvim/lazy/cfs-gruvbox-material,
# dark+hard+material variant). @thm_* must be set *before* the plugin's `run`
# below: its theme file only sets them with -o (only-if-unset).
#
# Not installed by this repo (see dotfiles/bootstrap/catppuccin-tmux.md for
# a Claude Code prompt that installs it on a fresh machine).
set -g @thm_bg "#282828"
set -g @thm_fg "#e5dac7"
set -g @thm_rosewater "#d3869b"
set -g @thm_flamingo "#e78a4e"
set -g @thm_pink "#d3869b"
set -g @thm_mauve "#d3869b"
set -g @thm_red "#ea6962"
set -g @thm_maroon "#e78a4e"
set -g @thm_peach "#e78a4e"
set -g @thm_yellow "#d8a657"
set -g @thm_green "#a9b665"
set -g @thm_teal "#89b482"
set -g @thm_sky "#89b482"
set -g @thm_sapphire "#7daea3"
set -g @thm_blue "#7daea3"
set -g @thm_lavender "#d3869b"
set -g @thm_subtext_1 "#e5dac7"
set -g @thm_subtext_0 "#ddc7a1"
set -g @thm_overlay_2 "#a89984"
set -g @thm_overlay_1 "#928374"
set -g @thm_overlay_0 "#7c6f64"
set -g @thm_surface_2 "#504945"
set -g @thm_surface_1 "#3c3836"
set -g @thm_surface_0 "#32302f"
set -g @thm_mantle "#282828"
set -g @thm_crust "#1a1919"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Show the tmux window name (#W, set via rename-window/prefix+,) instead of
# catppuccin's default #T (pane title) - #T is whatever the running program's
# OSC title happens to be (e.g. Claude Code's own session name), not
# something you control per-window.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# add plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# run tpm
run '~/.tmux/plugins/tpm/tpm'

# vim-tmux-navigator's own root-table bindings fork `ps | grep` via `if-shell`
# on every Ctrl-h/j/k/l/\ press. Under rapid key combos, an earlier keypress's
# async check can finish *after* a later one already changed the active pane,
# so its select-pane then applies to the wrong (now-current) pane — looks like
# panes swapping. Override with `if-shell -F` against tmux's own
# #{pane_current_command} (tracked natively, no fork needed at all), so the
# whole check-and-act happens in one synchronous tick — no race window left.
set -g @vim_nav_pattern '^g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'
# select-pane -L/-R/-U/-D wraps around to the opposite side of the layout
# when there's nothing further in that direction (confirmed by direct
# testing) - pressing e.g. C-l from the rightmost pane jumps you to the
# leftmost one, which looks exactly like the pane randomly "swapping" to
# somewhere unrelated. The pane_at_* guards below make it a no-op at an
# edge instead. (The nvim-side equivalent is @vim/tmux_navigator_no_wrap,
# set in lua/custom/plugins/vim-tmux-navigator.lua.)
bind-key -n C-h if-shell -F "#{m/r:#{@vim_nav_pattern},#{pane_current_command}}" { send-keys C-h } { if-shell -F "#{pane_at_left}" {} { select-pane -L } }
bind-key -n C-j if-shell -F "#{m/r:#{@vim_nav_pattern},#{pane_current_command}}" { send-keys C-j } { if-shell -F "#{pane_at_bottom}" {} { select-pane -D } }
bind-key -n C-k if-shell -F "#{m/r:#{@vim_nav_pattern},#{pane_current_command}}" { send-keys C-k } { if-shell -F "#{pane_at_top}" {} { select-pane -U } }
bind-key -n C-l if-shell -F "#{m/r:#{@vim_nav_pattern},#{pane_current_command}}" { send-keys C-l } { if-shell -F "#{pane_at_right}" {} { select-pane -R } }
bind-key -n 'C-\' if-shell -F "#{m/r:#{@vim_nav_pattern},#{pane_current_command}}" "send-keys 'C-\\'" "select-pane -l"

# pane styles (set after plugins to override theme)
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g window-style 'fg=#928374,bg=default'
set -g window-active-style 'fg=#DCC6A3,bg=default'

# status line modules - catppuccin's built-ins, no extra tmux plugins needed
# (must be set after the `run` above, per docs/reference/status-line.md)
set -g status-left-length 100
set -g status-right-length 100
# session indicator - commented out, re-enable by uncommenting:
# set -g status-left "#{E:@catppuccin_status_session}  "
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Terminal/QoL settings
set -g mouse on
set -ag terminal-overrides ",*:RGB"
set -g focus-events on
set -g allow-passthrough on      # required for terminal image protocols (e.g. rmpc/yazi album art & previews via Kitty graphics protocol) to render correctly inside tmux
setw -g aggressive-resize on
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"

# Keybindings help popup
# (Omarchy uses `omarchy-menu-tmux-keybindings`, which doesn't exist on this
# machine - reusing the existing keyboard-shortcuts reference doc instead,
# same one the `kbtmux` shell alias reads.)
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "bat $HOME/Projects/keyboard-shortcuts/tmux.md"

# Window navigation
bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Pane focus/resize without prefix
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D
bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C command-prompt -p "Session name:" "new-session -c '#{pane_current_path}' -s '%%'"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n
